<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Sistema Shyplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <header class="login-cabecera">
      <div class="login-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.2"></circle>
          <path d="M5.6 19.2c1.3-3.1 3.6-4.6 6.4-4.6s5.1 1.5 6.4 4.6"></path>
        </svg>
      </div>
      <h1>SISTEMA SHYPLAY</h1>
      <p>Evaluaciones psicométricas para reclutamiento</p>
    </header>
    <form class="login-form" id="form-login" data-servicio="auth.login" action="#" method="post" novalidate>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" placeholder="Ej. Juan" autocomplete="username">
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <p class="mensaje-error" id="login-error" hidden>Ingresa usuario y contraseña.</p>
      <button type="submit">INGRESAR</button>
    </form>
  </main>

  <!-- SPINNER / MODAL DE CARGA EN LOGIN -->
  <div id="modal-cargando-login" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
      <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #15a0cc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto;"></div>
      <h3 style="font-family: 'Montserrat', sans-serif; color: #333; margin: 0;">Un momento</h3>
      <p style="color: #666; font-size: 14px; margin-top: 5px;">Iniciando sesión...</p>
    </div>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script src="js/login.js"></script>
</body>
</html>
