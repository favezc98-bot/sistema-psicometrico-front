<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación | Sistema Shyplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-app">
<header class="barra">
  <div class="marca">
      <span class="marca-logo">
        <span class="marca-icono" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="#e6f5fb"/>
            <path fill="#15a0cc" d="M12 38c0-1.4.8-2.6 2-3.1l9.2-3c.8-.3 1.6.1 2.1.8l2.4 3.4 8.4-7.1c1.4-1.2 3.5-.4 3.8 1.4l.3 1.4-6.8 6 5 2.4c1.6.8 2 2.7 1 4.1L32 55.2c-2.4 3.2-7 4.4-10.8 2.6l-7.6-3.6c-1-.5-1.6-1.4-1.6-2.4V38z"/>
            <path fill="#0c74a0" d="M46 22c1.8.4 3.1 1.8 3.3 3.6l1.2 8.6c.3 1.8-1.1 3.4-2.9 3.4l-5.2.2 2 5c.7 1.6-.2 3.5-2 3.9l-3.4.8 1.5-5.6-4.6-2.6 3.7-4.6 3 1.3-.7-5.2c-.3-2 .8-3.9 2.8-4.5l1.3-.3z"/>
          </svg>
        </span>
        LOGO
      </span>
    <span class="marca-divisor" aria-hidden="true"></span>
    <p class="marca-empresa">NOMBRE DE EMPRESA</p>
  </div>
  <div class="aspirante">
    <div>
      <span class="aspirante-etiqueta">ASPIRANTE:</span>
      <strong class="aspirante-nombre" id="aspirante-nombre">Cargando...</strong>
    </div>
    <span class="aspirante-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.6 19.2c1.3-3.1 3.6-4.6 6.4-4.6s5.1 1.5 6.4 4.6"></path></svg>
      </span>
  </div>
</header>

<div class="layout" style="grid-template-columns: 1fr;">
  <!-- Menú lateral removido por completo para el candidato -->
  <main class="contenido" style="max-width: 800px; margin: 40px auto; width: 100%;">
    <h1 class="titulo-pagina">Evaluación Psicométrica</h1>
    <p class="subtitulo">Haz clic en comenzar cuando estés listo para iniciar tu prueba.</p>

    <section class="panel panel-destacado" style="text-align: center; padding: 40px; margin-top: 30px;">
      <p class="insignia" style="display: inline-block; margin-bottom: 15px;">Listo para iniciar</p>
      <h2 style="font-size: 24px; margin-bottom: 20px;">Prueba Psicométrica Unificada</h2>
      <p style="color: #666; margin-bottom: 30px;">Una vez que des clic en comenzar, el tiempo de 25 minutos empezará a correr de forma continua.</p>
      <a class="boton" id="boton-prueba-inicio" href="test.html" style="font-size: 18px; padding: 12px 40px; display: inline-block;">Comenzar</a>
    </section>
  </main>
</div>
<script src="js/comun.js"></script>
</body>
</html>
