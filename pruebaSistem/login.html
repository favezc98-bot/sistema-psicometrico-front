<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Sistema Shyplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <header class="login-cabecera">
      <div class="login-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.2"></circle>
          <path d="M5.6 19.2c1.3-3.1 3.6-4.6 6.4-4.6s5.1 1.5 6.4 4.6"></path>
        </svg>
      </div>
      <h1>SISTEMA SHYPLAY</h1>
      <p>Evaluaciones psicométricas para reclutamiento</p>
    </header>
    <form class="login-form" id="form-login" data-servicio="auth.login" action="#" method="post" novalidate>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" placeholder="Ej. Juan" autocomplete="username">
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <p class="mensaje-error" id="login-error" hidden>Ingresa usuario y contraseña.</p>
      <button type="submit">INGRESAR</button>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
